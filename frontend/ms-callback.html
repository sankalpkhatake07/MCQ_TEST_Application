<!doctype html><meta charset="utf-8"><title>Signing in…</title>
<p style="font-family:system-ui">Signing you in…</p>
<script>
  const p = new URLSearchParams(location.hash.slice(1));
  if (window.opener && p.get('id_token')) window.opener.postMessage({ type: 'ms-token', token: p.get('id_token') }, location.origin);
  else document.body.textContent = 'Sign-in failed: ' + (p.get('error_description') || 'no token');
</script>
