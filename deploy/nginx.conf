upstream api { server backend:8000; }          # Docker DNS returns every replica; nginx round-robins between them

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 10m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(self), fullscreen=(self)" always;

  # Server-sent events (live proctoring / live ranking): no buffering, long timeout
  location /api/live/stream {
    proxy_pass http://api;
    proxy_http_version 1.1; proxy_set_header Connection "";
    proxy_buffering off; proxy_cache off; proxy_read_timeout 1h;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /api/ {
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;      # used for the allowed-IP exam rule
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
